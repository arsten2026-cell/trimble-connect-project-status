<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1f1f1f; --muted:#6b6b6b; --line:#d9d5cc; --accent:#E37424; --panel:#fff; --bad:#b3261e; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--ink); font:13px/1.45 Ubuntu, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  h2 { font-size:12px; margin:16px 0 6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .top h1 { margin-right:auto; }
  .top h1 b { color:var(--accent); font-weight:600; }
  .status { font-size:12px; color:var(--muted); margin-bottom:8px; min-height:1.4em; }
  .status.bad { color:var(--bad); }
  .box { background:var(--panel); border:1px solid var(--line); padding:10px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
  button { font:inherit; padding:6px 10px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  button.secondary { background:transparent; color:var(--ink); border-color:var(--line); }
  button.small { padding:2px 8px; font-size:12px; }
  select { font:inherit; font-size:12px; padding:2px 4px; border:1px solid var(--line); background:#fff; border-radius:0; }
  label.chk { display:inline-flex; align-items:center; gap:5px; font-size:12px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; margin-top:6px; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; border:1px solid rgba(0,0,0,.25); }
  .stat { margin:7px 0; }
  .stat .hd { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; }
  .stat .hd b { font-weight:600; }
  .stat .num { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; white-space:nowrap; }
  .track { height:8px; background:#ece8df; margin-top:3px; }
  .fill { height:100%; }
  .sub { font-size:11px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; background:var(--panel); }
  th, td { padding:5px 3px; border-bottom:1px solid var(--line); text-align:left; }
  th { font-size:10.5px; font-weight:600; color:var(--muted); }
  td.c, th.c { text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:11.5px; }
  td.c.done { font-weight:600; }
  td.c.part { color:#b26a00; }
  td.c.none { color:#b8b4ab; }
  .name { font-weight:600; white-space:nowrap; }
  .tl { list-style:none; margin:0; padding:0; }
  .tl li { display:flex; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .tl .d { white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--muted); width:74px; flex:none; }
  .tl .dot { width:9px; height:9px; margin-top:4px; flex:none; border:1px solid rgba(0,0,0,.2); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .asof { display:flex; justify-content:space-between; font-size:12px; }
  .asof b { font-variant-numeric:tabular-nums; }
  .note { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .hl { font-size:13px; line-height:1.5; }
  .hl .big { font-size:24px; font-weight:600; color:var(--accent); vertical-align:-2px; margin-right:4px; }
  .hl .num { color:var(--muted); font-variant-numeric:tabular-nums; }
  .basis { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .basis b { color:var(--ink); font-weight:600; }
  .cnote { font-size:12.5px; margin-top:8px; padding:6px 8px; border-left:3px solid var(--accent); background:#fbf3ec; white-space:pre-wrap; }
  details.det > summary { cursor:pointer; font-size:12px; margin:16px 0 6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); min-height:32px; display:flex; align-items:center; }
  details.det > summary::-webkit-details-marker { display:none; }
  details.det > summary::before { content:"▸"; margin-right:6px; }
  details.det[open] > summary::before { content:"▾"; }
  #pubWhat > summary { cursor:pointer; min-height:32px; display:flex; align-items:center; }
  .seg { display:inline-flex; margin-left:auto; }
  .seg button { background:transparent; color:var(--ink); border-color:var(--line); }
  .seg button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .h2bar { display:flex; align-items:center; gap:8px; margin:16px 0 6px; }
  .h2bar h2 { margin:0; }
  tr.grp td { background:#f1ede4; font-weight:600; font-size:12px; padding-top:7px; }
  td.c.ok { color:#2E7D32; font-weight:600; }
  .fld { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  /* Дейности for the client (shared/arsten-activities.js) */
  .site .txt { flex:1; min-width:0; overflow-wrap:anywhere; }
  input[type=text], textarea { font:inherit; width:100%; padding:6px; border:1px solid var(--line); background:#fff; border-radius:0; }
  textarea { resize:vertical; min-height:56px; }
  .ask { margin:8px 0; padding:8px 10px; border-left:3px solid var(--bad); background:#fbeeed; font-size:12.5px; }
  .ask.pubq { border-left-color:var(--accent); background:#fff; border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  /* week 4: steel card (B-Client 2), print view (B-Client 4) */
  #steelCard { margin-top:8px; }
  #steelCard .big { font-size:20px; font-weight:600; color:var(--accent); vertical-align:-2px; }
  #steelCard .num { color:var(--muted); font-variant-numeric:tabular-nums; }
  #app.reporting #main, #app.reporting #status { display:none; }
  #report { background:#fff; border:1px solid var(--line); padding:14px; }
  #report .seg { margin-left:0; }
  .rep-top { display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted); border-bottom:2px solid var(--accent); padding-bottom:4px; }
  .rep-brand b { color:var(--accent); }
  .rep-h1 { font-size:18px; margin:10px 0 2px; }
  .rep-sub { font-size:12px; color:var(--muted); }
  .rep-card { border:1px solid var(--line); padding:8px 10px; margin-top:8px; font-size:13px; }
  .rep-card .big { font-size:20px; font-weight:600; color:var(--accent); }
  .rep-card .num { color:var(--muted); }
  .rep-h2 { font-size:12px; margin:14px 0 4px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .rep-t th, .rep-t td { padding:3px 4px; font-size:11px; }
  /* round 19 L1: a wide table scrolls inside its box, not the page (375 px phones) */
  .rep-scroll { overflow-x:auto; max-width:100%; }
  @media (max-width:420px) { .rep-t th { white-space:normal; } #report { padding:10px 8px; } }
  .rep-t td.c.done { font-weight:600; } .rep-t td.c.none { color:#b8b4ab; }
  .rep-l { list-style:none; margin:0; padding:0; font-size:11.5px; } .rep-l li { padding:2px 0; border-bottom:1px solid var(--line); }
  .rep-site li { display:flex; gap:6px; } .rep-site .d { flex:none; }
  .rep-ph { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; } .rep-ph img { width:120px; height:90px; object-fit:cover; border:1px solid var(--line); }
  .site .ph { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; } .site .ph img { width:64px; height:64px; object-fit:cover; border:1px solid var(--line); cursor:zoom-in; }
  /* sweep 18.11.2026 (b): a tile whose URL is still being asked keeps its place (the list does not jump) */
  .site .ph .ph-wait { display:inline-block; width:64px; height:64px; border:1px solid var(--line); background:#f1eee8; }
  /* the photos going out, in the publish question, with "не за клиента" per photo */
  .aph { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; } .aph .sub { flex-basis:100%; }
  .aph label { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; width:72px; }
  .aph img, .aph .ph-wait { width:64px; height:64px; object-fit:cover; border:1px solid var(--line); background:#f1eee8; }
  .aph label.drop img { opacity:.35; }
  #phView { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:10; }
  #phView img { max-width:96vw; max-height:90vh; }
  .rep-l .d { display:inline-block; min-width:80px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .rep-note { margin-top:10px; padding:6px 8px; border-left:3px solid var(--accent); background:#fbf3ec; font-size:12px; white-space:pre-wrap; }
  .rep-basis { margin-top:12px; font-size:11px; color:var(--muted); } .rep-basis b { color:var(--ink); }
  .rep-foot { margin-top:14px; padding-top:4px; border-top:1px solid var(--line); font-size:10.5px; color:var(--muted); text-align:right; }
  /* sweep 18.11.2026: touch sizes as the other site panels (the client and the PM open Статус on phones); 16px text in
     the fields so iOS does not zoom the page while the PM types the client note */
  @media (pointer: coarse) {
    button, button.small, select, input[type=text] { min-height:40px; }
    button.small { padding:6px 12px; font-size:14px; }
    select, input[type=text], textarea { font-size:16px; }
    select, input[type=text] { padding:6px 8px; }
    input[type=checkbox] { width:22px; height:22px; }
    label.chk { min-height:40px; font-size:14px; }
    input[type=range] { height:32px; }
    .bar { gap:8px; }
  }
  .pubdone { color:#2E7D32; font-weight:600; }
  @media print {
    @page { size:A4; margin:14mm 12mm; }
    body { background:#fff; padding:0; font-size:11px; }
    #app > :not(#report), .noprint, [data-arsten-diag] { display:none !important; }
    #report { border:0; padding:0; }
    .rep-scroll { overflow:visible; }
    tr, .rep-card, .rep-note, .rep-l li { break-inside:avoid; }
    thead { display:table-header-group; }
    tr.grp td { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="top"><h1 id="title">Статус</h1>
    <select id="selLang" title="Language / Език"><option value="bg">BG</option><option value="en">EN</option></select></div>
  <button type="button" class="small secondary" data-arsten-diag style="float:right;margin-left:6px">Копирай диагностика</button>
  <div id="status" class="status">Trimble Connect…</div>
  <!-- sweep 18.11.2026: the client's "Опитай пак" when the report could not be loaded (not "nothing published") -->
  <button id="btnRetry" hidden style="margin-bottom:8px"></button>

  <div id="main" hidden>
    <div class="bar" id="leaveBar" hidden style="margin-top:0"><button id="btnLeaveClient"></button></div>
    <div class="box" id="headline"></div>
    <div class="box" id="steelCard" hidden></div>

    <h2 id="hPub" hidden></h2>
    <div class="box" id="pubBox" hidden>
      <label class="chk"><input type="checkbox" id="chkAsClient"> <span id="lblAsClient"></span></label>
      <div class="sub" id="pubWho" hidden></div>
      <div id="pubForm">
        <label class="fld" for="inStage" id="lblStage"></label><input type="text" id="inStage" maxlength="200">
        <label class="fld" for="inNote" id="lblNote"></label><textarea id="inNote" rows="3" maxlength="2000"></textarea>
        <div class="bar"><button id="btnPublish"></button><span class="sub" id="pubInfo"></span></div>
        <!-- sweep 18.11.2026: after a publish, the weekly report of it is one press away -->
        <div class="bar" id="pubDone" hidden><span class="pubdone" id="pubDoneText"></span><button id="btnPubPrint" class="small secondary"></button></div>
        <div class="ask" id="steelAsk" hidden role="alert"><div id="steelAskText"></div>
          <div class="bar" style="margin-bottom:0"><button id="btnSteelGo"></button><button id="btnSteelCancel" class="secondary"></button></div></div>
        <!-- sweep 18.11.2026: the publish question in the panel (window.confirm can be blocked in Connect's frame) -->
        <div class="ask pubq" id="pubAsk" hidden role="alert"><div id="pubAskText" style="white-space:pre-line;overflow-wrap:anywhere"></div>
          <!-- sweep 18.11.2026 (b): more than 20 new entries must be opened before "Публикувай"; the photos going out -->
          <div class="bar" id="pubAllBar" hidden><button id="btnPubAll" class="small secondary"></button><span class="sub" id="pubAllHint"></span></div>
          <div class="aph" id="pubAskPhotos" hidden></div>
          <div class="bar" style="margin-bottom:0"><button id="btnPubGo"></button><button id="btnPubCancel" class="secondary"></button></div></div>
        <div class="sub" id="pubHint"></div>
        <details class="sub" id="pubWhat"><summary id="pubWhatSum"></summary><div id="pubWhatText"></div></details>
      </div>
    </div>

    <!-- Дейности for the client (from the published summary; entered in the Дейности panel) -->
    <h2 id="hSite" hidden></h2>
    <div class="box" id="siteBox" hidden>
      <div class="sub" id="siteHint"></div>
      <ul class="tl site" id="siteList"></ul>
    </div>
    <div id="phView" hidden><img id="phViewImg" alt=""></div>

    <div class="box" id="sumBox" hidden style="margin-top:8px">
      <div class="bar" style="margin:0">
        <label class="chk"><span id="lblSum"></span> <select id="selSum"></select></label>
        <button id="btnPrint" class="small secondary" style="margin-left:auto" hidden></button>
      </div>
    </div>

    <div class="box" style="margin-top:8px">
      <div class="bar" style="margin-top:0">
        <label class="chk"><input type="checkbox" id="chkColour" checked> <span id="lblColour"></span></label>
        <button id="btnView" class="small secondary" style="margin-left:auto"></button>
      </div>
      <div id="legend" class="legend"></div>
      <!-- sweep 18.11.2026: the view name in the panel (window.prompt can be blocked in Connect's frame) -->
      <div id="viewAsk" hidden>
        <label class="fld" for="inViewName" id="lblViewName"></label><input type="text" id="inViewName" maxlength="120">
        <div class="bar" style="margin-bottom:0"><button id="btnViewSave"></button><button id="btnViewCancel" class="secondary"></button></div>
      </div>
    </div>

    <h2 id="hAsOf"></h2>
    <div class="box" id="asOfBox">
      <div class="asof"><span id="lblAsOf"></span><b id="asOfDate"></b></div>
      <!-- sweep 18.11.2026 (b): the label and the date are spoken with the slider; day / week steps for a phone -->
      <input type="range" id="rngAsOf" min="0" max="0" value="0" aria-labelledby="lblAsOf asOfDate">
      <div class="bar" style="margin-bottom:0"><button id="btnWeekBack" class="small secondary"></button><button id="btnDayBack" class="small secondary"></button><button id="btnDayFwd" class="small secondary"></button><button id="btnToday" class="small secondary"></button></div>
    </div>

    <details class="det" id="details"><summary id="sumDetails"></summary>
      <div class="box" id="overall"></div>
    </details>

    <div class="h2bar"><h2 id="hPours"></h2>
      <span class="seg"><button id="btnByType" class="small"></button><button id="btnList" class="small"></button></span></div>
    <table><thead id="pourHead"></thead><tbody id="pourRows"></tbody></table>
    <div class="note" id="looseNote" hidden></div>

    <h2 id="hTimeline"></h2>
    <ul class="tl" id="timeline"></ul>
    <div class="bar"><button id="btnMore" class="small secondary" hidden></button></div>
  </div>

  <!-- B-Client 4: print view of the shown published summary (report.js); @media print shows only this -->
  <div id="report" hidden>
    <div class="bar noprint" style="margin-top:0">
      <button id="btnDoPrint"></button><button id="btnBack" class="secondary"></button>
      <span class="seg"><button id="btnWeek" class="small"></button><button id="btnMonth" class="small"></button></span>
    </div>
    <div class="sub noprint" id="printHint"></div>
    <div id="repBody"></div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js" integrity="sha384-lFiNt/56q6HnUNbuy0WHO3NP6BkQjY4EH8+5eELYVfnhkB42snRTmSa3UOAlX9gg" crossorigin="anonymous"></script>
<script src="arsten-perf.js?v=21f7454938"></script>
<script src="arsten-diag.js?v=bb0c6351fe"></script>
<script src="arsten-i18n.js?v=c58f01c9fc"></script>
<script src="arsten-access.js?v=fad565fcbe"></script>
<script src="common.js?v=a04c428e31"></script>
<script src="status.js?v=5dfad10961"></script>
<script src="psetapi.js?v=d4dfd5ed57"></script>
<script src="arsten-links.js?v=7bf607a606"></script>
<script src="arsten-acceptance.js?v=f8e113bc4d"></script>
<script src="arsten-backup.js?v=6c54dfe763"></script>
<script src="progress.js?v=c853f700b7"></script>
<script src="records.js?v=a7ccda6573"></script>
<script src="fabrication.js?v=7108b8ac3e"></script>
<script src="steel-summary.js?v=05bef6fa3f"></script>
<script src="client-summary.js?v=89f27cc8bb"></script>
<script src="report.js?v=04ca57236a"></script>
<script src="arsten-activities.js?v=61c84547b9"></script>
<script src="app.js?v=0479dc1d59"></script>
</body>
</html>
